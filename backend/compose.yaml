services:
  api:
    build: .
    command: [ "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8080" ]
    environment:
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      BROKER_ENCRYPTION_KEY: ${BROKER_ENCRYPTION_KEY:-}
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL:-}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN:-}
      TRADING_WORKER_ENABLED: ${TRADING_WORKER_ENABLED:-false}
      LIVE_ARMED: ${LIVE_ARMED:-false}
      LIVE_MAX_NOTIONAL_USDT: ${LIVE_MAX_NOTIONAL_USDT:-}
      LIVE_DAILY_LOSS_USDT: ${LIVE_DAILY_LOSS_USDT:-}
      LIVE_SYMBOLS: ${LIVE_SYMBOLS:-}
      LIVE_KILL_SWITCH: ${LIVE_KILL_SWITCH:-false}
      TRADING_ADMIN_USER_IDS: ${TRADING_ADMIN_USER_IDS:-}
      TESTNET_MAX_NOTIONAL_USDT: ${TESTNET_MAX_NOTIONAL_USDT:-25}
    ports:
      - "8080:8080"
    healthcheck:
      test: [ "CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8080/health', timeout=5)" ]
      interval: 60s
      timeout: 17s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  worker:
    build: .
    command: [ "uvicorn", "worker.main:app", "--host", "0.0.0.0", "--port", "8081" ]
    environment:
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      BROKER_ENCRYPTION_KEY: ${BROKER_ENCRYPTION_KEY:-}
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL:-}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN:-}
      JEV_API_KEY: ${JEV_API_KEY:-}
      TRADING_WORKER_ENABLED: ${TRADING_WORKER_ENABLED:-false}
      LIVE_ARMED: ${LIVE_ARMED:-false}
      LIVE_MAX_NOTIONAL_USDT: ${LIVE_MAX_NOTIONAL_USDT:-}
      LIVE_DAILY_LOSS_USDT: ${LIVE_DAILY_LOSS_USDT:-}
      LIVE_SYMBOLS: ${LIVE_SYMBOLS:-}
      LIVE_KILL_SWITCH: ${LIVE_KILL_SWITCH:-false}
      TESTNET_MAX_NOTIONAL_USDT: ${TESTNET_MAX_NOTIONAL_USDT:-25}
    expose:
      - "8081"
    healthcheck:
      test: [ "CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8081/health', timeout=5)" ]
      interval: 60s
      timeout: 17s
      retries: 3
      start_period: 5s
    restart: unless-stopped
